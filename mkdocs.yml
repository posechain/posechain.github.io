site_name: Posechain Engineering Portfolio
site_description: Engineering Portfolio
site_author: Jason Force
site_url: https://posechain.github.io

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/posechain-logo.png
  favicon: assets/images/favicon.png
  palette:
    scheme: slate
    primary: blue grey
    accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/posechain.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

nav:
  - About This Portfolio: index.md
  - Selected Work: selected-work.md
  - Resume: resume.md
  - Contact: contact.md
  - Engineering Case Studies:
      - Optical Tracking & FSM Control:
          - Overview: work/optical-tracking-fsm.md
      - Distributed Robotics:
          - Overview: work/distributed-robotics.md
      - Space Systems & Integration:
          - Overview: work/space-systems-payload-integration.md